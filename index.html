<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueLib Catalogue &mdash; BlueCrest College Library</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="site-name">BlueLib Catalogue</h1>
    <p class="tagline">BlueCrest College Library</p>
  </header>

  <nav class="site-nav">
    <ul>
      <li><a href="#catalogue">Browse Books</a></li>
      <li><a href="#add-book">Add a Book</a></li>
    </ul>
  </nav>

  <main>

    <section id="catalogue" aria-labelledby="catalogue-heading">
      <h2 id="catalogue-heading">Browse the Catalogue</h2>

      <div class="controls">
        <div class="control-group">
          <label for="search-input">Search by title</label>
          <input type="text" id="search-input" placeholder="e.g. Data Structures">
        </div>

        <div class="control-group">
          <label for="category-filter">Filter by category</label>
          <select id="category-filter">
            <option value="all">All Categories</option>
            <option value="IT">IT</option>
            <option value="Business">Business</option>
            <option value="Science">Science</option>
            <option value="Arts">Arts</option>
          </select>
        </div>
      </div>

      <div id="book-list" class="book-grid">
        <!-- Book cards are rendered here by js/app.js -->
      </div>

      <p id="no-results" class="no-results" hidden>No books match your search.</p>
    </section>

    <section id="add-book" aria-labelledby="add-book-heading">
      <h2 id="add-book-heading">Add a Book</h2>

      <form id="add-book-form" novalidate>
        <div class="form-row">
          <label for="title-input">Title</label>
          <input type="text" id="title-input" name="title" required>
        </div>

        <div class="form-row">
          <label for="author-input">Author</label>
          <input type="text" id="author-input" name="author" required>
        </div>

        <div class="form-row">
          <label for="category-input">Category</label>
          <select id="category-input" name="category" required>
            <option value="">Choose a category</option>
            <option value="IT">IT</option>
            <option value="Business">Business</option>
            <option value="Science">Science</option>
            <option value="Arts">Arts</option>
          </select>
        </div>

        <div class="form-row">
          <label for="copies-input">Copies Available</label>
          <input type="number" id="copies-input" name="copies" min="0" step="1" required>
        </div>

        <button type="submit" class="btn btn-primary">Add Book</button>

        <p id="form-error" class="form-error" role="alert" hidden></p>
      </form>
    </section>

  </main>

  <footer class="site-footer">
    <p>Clifford Koarmoah Nyarko &mdash; Student ID: [Your Student ID]</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
